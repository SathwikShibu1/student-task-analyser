<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Login – Student Task Analyser</title>

  <link
    rel="stylesheet"
    href="/css/styles.css"
  />
</head>

<body class="auth-page">

  <div class="auth-wrapper">

    <div class="auth-card premium-auth">

      <div class="auth-top-glow"></div>

      <div class="auth-logo premium-logo">

        <div class="logo-icon">
          📚
        </div>

        <h1>
          Welcome Back
        </h1>

        <p>
          Sign in to continue your productivity journey.
        </p>

      </div>

      <div id="message" class="alert"></div>

      <form id="login-form">

        <div class="form-group">

          <label>Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          />

        </div>

        <div class="form-group">

          <label>Password</label>

          <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
          />

        </div>

        <label class="checkbox-row">

          <input
            type="checkbox"
            id="remember"
            checked
          />

          <span>
            Keep me logged in
          </span>

        </label>

        <button
          type="submit"
          class="btn btn-primary auth-btn"
          id="submit-btn"
        >
          Sign In
        </button>

      </form>

      <div class="auth-links">

        <a href="/forgot-password.html">
          Forgot Password?
        </a>

        <p>
          Don’t have an account?

          <a href="/signup.html">
            Sign Up
          </a>
        </p>

      </div>

    </div>

  </div>
<script src="/js/auth/login.js"></script>

</body>
</html>
