<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password – Student Task Analyser</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">🔑</div>
      <h1>Forgot Password?</h1>
      <p>Enter your email and we'll send a reset link.</p>
    </div>

    <div id="message" class="alert"></div>

    <form id="forgot-form">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Send Reset Link</button>
    </form>

    <!-- Dev mode: shows reset link when email sending fails -->
  
<script src="/js/auth/forgotpassword.js"></script>
</body>
</html>
