<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Sign Up – Student Task Analyser
  </title>

  <link
    rel="stylesheet"
    href="/css/styles.css"
  />
</head>

<body class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">

      <div class="logo-icon">
        📚
      </div>

      <h1>
        Create your account
      </h1>

      <p>
        Start managing your tasks smarter.
      </p>

    </div>

    <div
      id="error-msg"
      class="alert"
    ></div>

    <form
      id="signup-form"
      autocomplete="off"
    >

      <div class="form-group">

        <label for="name">
          Your name
        </label>

        <input
          type="text"
          id="name"
          placeholder="e.g. Arjun Kumar"
          required
        />

      </div>

      <div class="form-group">

        <label for="email">
          Email address
        </label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        />

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div style="position:relative;">

          <input
            type="password"
            id="password"
            placeholder="At least 6 characters"
            minlength="6"
            required
            style="padding-right:50px;"
          />

          <button
            type="button"
            id="toggle-password"
            style="
              position:absolute;
              right:14px;
              top:50%;
              transform:translateY(-50%);
              border:none;
              background:none;
              cursor:pointer;
              font-size:1rem;
            "
          >
            👁️
          </button>

        </div>

      </div>

      <label class="checkbox-row">

        <input
          type="checkbox"
          id="remember"
          checked
        />

        Keep me logged in

      </label>

      <button
        type="submit"
        class="btn btn-primary"
        id="submit-btn"
      >
        Send OTP
      </button>

    </form>

    <p
      style="
        text-align:center;
        margin-top:1rem;
        font-size:0.9rem;
        color:var(--muted);
      "
    >
      Already have an account?

      <a href="/login.html">
        Sign in
      </a>
    </p>

  </div>



  <script src="/js/auth/signup.js"></script>

</body>
</html>
